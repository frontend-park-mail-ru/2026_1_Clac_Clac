name: S3 Deploy
description: Deploy Frontend dist to S3 with zero-downtime

inputs:
  aws-access-key-id:
    description: "S3 Access Key"
    required: true
  aws-secret-access-key:
    description: "S3 Secret Key"
    required: true
  aws-region:
    description: "S3 Region"
    required: true
  bucket-name:
    description: "Bucket Name"
    required: true
  endpoint-url:
    description: "S3 Endpoint"
    required: true
  source-dir:
    description: "Frontend Folder"
    required: true

runs:
  using: composite
  steps:
    - name: Configure Credentials
      uses: aws-actions/configure-aws-credentials@v6.1.0
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Deploy to S3
      shell: bash
      run: |
        ENDPOINT="${{ inputs.endpoint-url }}"
        BUCKET="s3://${{ inputs.bucket-name }}"
        SOURCE="${{ inputs.source-dir }}"

        aws s3 sync "$SOURCE/" "$BUCKET/" \
          --endpoint-url "$ENDPOINT" \
          --exclude "index.html"

        aws s3 cp "$BUCKET/index.html" "$BUCKET/index-prev.html" \
          --endpoint-url "$ENDPOINT" || true

        aws s3 cp "$SOURCE/index.html" "$BUCKET/index.html" \
          --endpoint-url "$ENDPOINT"
