name: Build and Deploy Pipeline

on:
  workflow_call:
    inputs:
      endpoint-url:
        description: "S3 Endpoint"
        required: true
        type: string
      aws-region:
        description: "S3 Region"
        required: true
        type: string
      bucket-name:
        description: "S3 Bucket name"
        required: true
        type: string
    secrets:
      S3_ACCESS_KEY:
        required: true
      S3_SECRET_KEY:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/

      - name: Run S3 Deploy Action
        uses: ./.github/actions/s3-deploy
        with:
          aws-access-key-id: ${{ secrets.S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.S3_SECRET_KEY }}
          aws-region: ${{ inputs.aws-region }}
          bucket-name: ${{ inputs.bucket-name }}
          endpoint-url: ${{ inputs.endpoint-url }}
          source-dir: "dist"
